# decompanion target project: gildegold
# Everything here is typed state; `dcp` derives the rest into build/ (ignored).
#
# Init declares nothing. Every decision of the decompilation is an obligation `dcp status` names when it is due,
# with the evidence and the command that resolves it: `dcp toolchain declare compiler=... linker=... root=...
# cflags=... --why "..."`, `dcp libs declare ARCHIVE... --why "..."`, `dcp analyzer declare ... --why "..."`.
# The declarations land here with their reasons (reason.<key> = "...").

# The binaries built from this codebase; the first is the default target (`--target NAME` selects another,
# `dcp target add NAME PATH` adds one). Each target has its own store, build/<name>.sqlite, and its own
# toolchain declaration (compiler, linker, cflags, archives). name, path, sha256, image and isa are computed
# from the file.
[[target]]
name = "exe"
path = "{game}/GildeGold.exe"
sha256 = "d6f20fda136cd7ced612b96094e527a137f129543753f0fec0e357f6aecb3074"
image = "pe32"
isa = "x86"
compiler = "cl 12.00.9044"
linker = "link 6.00.8447"
cflags = ["/O2", "/Gy"]
reason.compiler = "157 game objects carry C2 9044 (only MSVC600-SP5PP makes it), linker 8447 x53; rea byte-matched zlib 1.1.3 and 2664 functions with /O2 /Gy under this install (SP6 c2 9782 does not match)"
reason.linker = "157 game objects carry C2 9044 (only MSVC600-SP5PP makes it), linker 8447 x53; rea byte-matched zlib 1.1.3 and 2664 functions with /O2 /Gy under this install (SP6 c2 9782 does not match)"
reason.cflags = "157 game objects carry C2 9044 (only MSVC600-SP5PP makes it), linker 8447 x53; rea byte-matched zlib 1.1.3 and 2664 functions with /O2 /Gy under this install (SP6 c2 9782 does not match)"
archives = ["{toolchain.root}/VC98/Lib/LIBC.LIB", "{toolchain.root}/VC98/Lib/DINPUT.LIB", "{dxsdk8}/lib/dxguid.lib", "{dxsdk8}/lib/strmiids.lib"]
reason.archives = "no MSVCRT import, single-threaded CRT: LIBC.LIB places 157 members against LIBCMT's 109; VC98/Lib/DINPUT.LIB places dilib2.obj at 0x5dd3e0..0x5de3e0 and dilib1.obj at 0x5de3e0..0x5de450; the GUIDs come from the DirectX 8.0 SDK (archive.org direct-x-8): its strmiids.lib holds one COMDAT section per GUID in exactly the original's order at 0x5eeee0..0x5eef50 (IGraphBuilder .. CLSID_FilterGraph; VC98's STRMIIDS.LIB gives another order), its dxguid.lib reproduces the 9 DirectX GUIDs at 0x5eee50..0x5eeee0 (the DX 6.1 SDK's holds all 391 in one section)"

[sources]
roots = ["src"]
include = ["include"]

[queue]
# The easy tier's bounds: a readability-only item of an original at most easy_read_max_bytes, or a code draft
# of an original at most easy_max_bytes whose instruction distance is at most easy_max_dist. Everything else is
# hard. All three are 100% above the built-in defaults (256 / 24 / 1024).
easy_max_bytes = 512
easy_max_dist = 48
easy_read_max_bytes = 2048

[analyzer]
# The third-party analyzer `dcp setup` runs for a draft of every function (src/decompanion/analyzers/): "ghidra"
# (headless; root, java_home, timeout = seconds per function), "rea" (file = saved batch_decompile results),
# "none" (dcp draft writes @rough skeletons from the disassembly). Its function starts are declarations.
# Written by `dcp init` from what this machine has; an obligation until `dcp analyzer declare` confirms it.
plugin = "ghidra"
root = "{ghidra}"
java_home = "{java}"
reason = "Ghidra 12.1.4 headless drafts for the functions rea left without a source; rea's own sources stay ahead of the drafts"

[toolchain]
root = "{msvc6}"
reason.root = "157 game objects carry C2 9044 (only MSVC600-SP5PP makes it), linker 8447 x53; rea byte-matched zlib 1.1.3 and 2664 functions with /O2 /Gy under this install (SP6 c2 9782 does not match)"
include_dirs = ["{dxsdk6}/include"]
lib_dirs = ["{dxsdk6}/lib"]
reason.include_dirs = "the game includes ddraw.h / dinput.h of the DirectX 6.1 SDK (rea config/build.toml dxsdk_root; dinput.lib tables at 0x5dd3e0 byte-equal its lib)"

# Running a build (decompanion docs/run.md): `dcp run play`.
[[variant]]
name = "debug"
reason = "manual testing (rea's play): 16-bit back buffer in a window, frame dumps, the start shortcut"
  [[variant.unit]]
  glob = "dd_vesa"
  cflags = ["/DREA_FIX_16BPP", "/DREA_FRAME_DUMP"]
  [[variant.unit]]
  glob = ["d3_d3d", "shp", "gfx", "d2"]
  cflags = ["/DREA_FRAME_DUMP"]
  [[variant.unit]]
  glob = ["main", "sv_t"]
  cflags = ["/DREA_START"]

[[setup]]
name = "game"
reason = "the GOG install's folders linked, its ini/dll/asi files copied; the install itself is never written"
  [[setup.stage]]
  from = "{target.dir}"
  link = ["*/"]
  copy = ["*.ini", "*.dll", "*.asi", "*.as6", "*.def", "*.sdb", "*.info"]
  [[setup.step]]
  run = ["uv", "run", "python", "tools/run/compat_shim.py"]
  [[setup.step]]
  run = ["uv", "run", "python", "tools/run/game_ini.py"]

[[run]]
name = "play"
variant = "debug"
setup = "game"
debug = true
args = ["DIRECTWINDOW"]

[[run]]
name = "plain"
setup = "game"
args = ["DIRECTWINDOW"]

[paths]
# The directories outside the project, by name: `{name}` in this file stands for one. These are one machine's;
# another machine gives its own in decompanion.local.toml (not committed: [paths] only, same names).
game = "C:/Program Files/GOG Galaxy/Games/The Guild Gold"   # the GOG install of The Guild Gold (GildeGold.exe)
msvc6 = "C:/Tools/MSVC600-SP5PP"                            # Visual C++ 6.0 SP5 + Processor Pack (cl 12.00.9044)
dxsdk6 = "C:/Tools/DXSDK61"                                 # DirectX 6.1 SDK
dxsdk8 = "C:/Tools/DXSDK8"                                  # DirectX 8.0 SDK
ghidra = "C:/Tools/ghidra_12.1.4_PUBLIC"                    # optional: drafts (dcp setup)
java = "C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot"  # optional: Ghidra's JDK 21
